<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<title>SolPrende en 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Pitch en 3D: la escena es el fondo; a la izquierda quién presenta y qué dice, a la derecha los datos y gráficos de la lámina. Aspecto único (claro). */
:root{--noche:#0B2650;--azul:#0166B0;--azul2:#014C88;--sol:#F5B404;--ahorro:#3E7D10;--verde:#63B523;--red:#6DB3E8;--fondo:#F5F8FB;--blanco:#FFFFFF;--ink2:#4A5F74;--borde:#C3D1DF;--claro:#E7EEF5;--tinteA:#DCEAF6;--tinteV:#E7F3DA;--tinteS:#FFF2CC;color-scheme:light;padding:0!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--fondo);color:var(--noche);font-family:"Public Sans",system-ui,sans-serif}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none;cursor:grab}
#stage.pick{cursor:pointer}
#fade{position:fixed;inset:0;background:var(--fondo);opacity:0;pointer-events:none;transition:opacity .32s}
#fade.on{opacity:1}
.load{position:fixed;inset:0;display:grid;place-items:center;background:var(--fondo);font:600 18px "Sora",system-ui,sans-serif;transition:opacity .4s;z-index:9;text-align:center;padding:24px}
body.ready .load{opacity:0;pointer-events:none}
#labels,#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#appvid{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);width:min(56vw,900px);border-radius:16px;box-shadow:0 24px 60px rgba(11,38,80,.35);background:#0B2650;opacity:0;pointer-events:none;transition:opacity .5s;z-index:3}
#appvid.on{opacity:1}
#datos.datos{width:auto;padding:14px 18px}
.logo-panel{display:block;width:200px;height:auto}
.lb{position:absolute;left:0;top:0;width:0;height:0}
.lb i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--noche);box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.lb s{position:absolute;left:0;top:-1px;height:2px;background:var(--noche);transform-origin:0 50%;opacity:.55}
.lb button{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;white-space:nowrap;border:1.5px solid var(--noche);background:var(--blanco);color:var(--noche);font:600 14px/18px "Public Sans",sans-serif;border-radius:999px;padding:6px 12px;cursor:pointer;box-shadow:0 4px 12px rgba(11,38,80,.16)}
.lb button small{display:none}.lb.sel button small{display:block;white-space:normal;width:250px;margin-top:3px;font-weight:400;font-size:13px;line-height:17px}
.lb button:hover,.lb.sel button{background:var(--noche);color:var(--blanco)}
.tg{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font:500 13px "IBM Plex Mono",monospace;color:var(--noche);background:rgba(255,255,255,.92);border:1px solid var(--borde);border-radius:6px;padding:3px 8px}
.tg.ax{background:none;border:0;color:var(--ink2);padding:0}
.tg.big.fx{font-size:19px;line-height:24px;padding:8px 14px;border-radius:8px}
.tg.big{font:700 15px "Sora",sans-serif;background:var(--noche);color:var(--blanco);border-color:var(--noche);padding:5px 10px}
/* columnas laterales */
.side{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100% - 118px);overflow:auto;box-sizing:border-box;background:var(--blanco);border:1px solid var(--borde);border-radius:14px;box-shadow:0 14px 34px rgba(11,38,80,.16);transition:opacity .3s;scrollbar-width:thin}
.guion{left:16px;width:auto;padding:12px 18px 12px 14px;display:flex;flex-direction:column;gap:10px}
#num,#say,#rowsH,#rows{display:none!important}   /* en pantalla solo se ve quién presenta; el guion queda en el Word */
.who{display:flex;align-items:center;gap:10px}
.who b{flex:none;width:40px;height:40px;border-radius:50%;background:var(--azul);color:var(--blanco);display:grid;place-items:center;font:700 16px "Sora",sans-serif}
.who small{display:block;font-size:11.5px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.who strong{font:700 17px/1.2 "Sora",sans-serif}
.when{font:500 12px "IBM Plex Mono",monospace;color:var(--ink2);border-top:1px solid var(--claro);padding-top:8px}
.guion ul{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:7px;font-size:14.5px;line-height:1.42}
.guion h3{margin:2px 0 0;font:600 11.5px "Public Sans",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.rows{display:flex;flex-direction:column;gap:2px}
.row{all:unset;box-sizing:border-box;width:100%;cursor:pointer;border-radius:8px;padding:5px 8px;font-size:13px;line-height:1.35;color:var(--ink2)}
.row b{display:block;color:var(--noche);font-weight:600;font-size:13.5px}
.row:hover,.row.sel{background:var(--claro)}
.row.sel{box-shadow:inset 3px 0 0 var(--azul)}
.datos{right:16px;width:clamp(400px,38vw,760px);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
body.clean .side,body.noguion .side{opacity:0;pointer-events:none}
/* piezas del panel de datos */
.d h2{margin:0;font:700 21px/1.2 "Sora",sans-serif;letter-spacing:-.01em}
.d p{margin:0}
.eye{font:600 12px "Public Sans",sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.num{font-family:"IBM Plex Mono",monospace;font-weight:500}
.foot{font-size:12px;line-height:1.4;color:var(--ink2);border-top:1px solid var(--claro);padding-top:8px}
.card{background:var(--blanco);border:1px solid var(--borde);border-radius:10px;padding:10px 13px;display:flex;flex-direction:column;gap:4px}
.card h3{margin:0;font:700 15.5px "Sora",sans-serif}
.card p{font-size:13.5px;line-height:1.4;color:var(--ink2)}
.stack{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ix{display:flex;gap:12px;align-items:flex-start}
.ix .num{white-space:nowrap}
.ix .n{flex:none;font:500 22px "IBM Plex Mono",monospace;color:var(--azul)}
.ix .c{flex:none;width:30px;height:30px;border-radius:50%;background:var(--azul);color:var(--blanco);display:grid;place-items:center;font:500 15px "IBM Plex Mono",monospace}
.band{display:flex;align-items:center;gap:14px;border-radius:10px;padding:12px 16px;background:var(--tinteA)}
.band .num{font-size:34px;color:var(--azul2);line-height:1}
.band p{font-size:13.5px;line-height:1.4}
.warn{background:var(--tinteS);border-radius:8px;padding:9px 12px;font-size:13px;line-height:1.4}
.ok{background:var(--tinteV);border-radius:8px;padding:9px 12px;font-size:13px;line-height:1.4}
.dark{background:var(--noche);color:var(--blanco);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dark .eye{color:#F5B404}
.dark p{color:#C9D8E6}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .num{font-size:30px;line-height:1.1;color:var(--noche)}
.kpi .k{font:700 12px "Public Sans",sans-serif;letter-spacing:.06em;text-transform:uppercase}
.kpi p{font-size:13.5px;line-height:1.35;color:var(--noche)}
/* gráfico de barras del edificio tipo */
.bars{display:flex;gap:14px;height:150px;align-items:flex-end;border-bottom:1px solid #3E5F80;padding-top:6px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bars .v{font:500 14px "IBM Plex Mono",monospace;color:var(--blanco)}
.bars .v.g{color:var(--verde)}
.bars i{display:block;width:62%;border-radius:4px 4px 0 0;height:0;transition:height 1.1s cubic-bezier(.2,.8,.2,1)}
.bars .neg{border-radius:4px}
.blab{display:flex;gap:14px}
.blab p{flex:1;text-align:center;font-size:12.5px;line-height:1.25;color:#C9D8E6}
.tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #22406E;padding-top:8px}
.tot .num{font-size:24px;color:var(--verde)}
/* personas y mapa de empatía */
.per{display:flex;gap:12px;align-items:flex-start}
.per b{flex:none;width:40px;height:40px;border-radius:50%;background:var(--tinteA);display:grid;place-items:center;font:700 14px "Sora",sans-serif}
/* canvas */
.cv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cv div{background:var(--blanco);border:1px solid var(--borde);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.35;color:var(--noche)}
.cv h4{margin:0 0 3px;font:700 12px "Public Sans",sans-serif;color:var(--azul)}
.cv .vp{grid-column:1/-1;background:var(--azul);border-color:var(--azul);color:var(--blanco)}
.cv .vp h4{color:var(--blanco)}
.cv .cost{background:var(--claro)}
.cv .ing{grid-column:span 2;background:var(--tinteV)}
.cv .ing h4{color:var(--ahorro)}
/* ingresos */
.leg{display:flex;flex-direction:column;gap:6px}
.leg div{display:flex;align-items:center;gap:10px;font-size:13.5px}
.leg i{flex:none;width:14px;height:14px;border-radius:3px}
.leg .num{margin-left:auto;font-size:14px}
/* tabla de iteraciones */
.it{display:flex;flex-direction:column;gap:6px}
.it.two{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.it div{display:grid;grid-template-columns:1fr 18px 1fr;gap:6px;align-items:start;font-size:13px;line-height:1.35;border-bottom:1px solid var(--claro);padding-bottom:6px}
.it s{color:var(--ink2);text-decoration-color:rgba(74,95,116,.5)}
.it b{font-weight:600}
.it em{grid-column:1/-1;font-style:normal;font-size:12px;color:var(--ink2)}
/* mercado */
.mk{display:flex;flex-direction:column;gap:6px}
.mk div{display:grid;grid-template-columns:52px 1fr auto;gap:4px 10px;align-items:baseline;border-radius:8px;padding:8px 10px;background:var(--claro)}
.mk .t{font:700 13px "Sora",sans-serif}
.mk .num{font-size:20px;text-align:right}
.mk p{grid-column:2/-1;font-size:12px;line-height:1.35;color:var(--ink2)}
.mk .sam{background:var(--tinteA)}
.mk .som{background:var(--tinteS)}
.fun{display:flex;flex-direction:column;gap:4px}
.fun div{display:grid;grid-template-columns:104px 1fr 72px;gap:8px;align-items:center;font-size:12.5px}
.fun i{display:block;height:14px;border-radius:3px;background:var(--azul);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.fun .num{font-size:12.5px;text-align:right}
.rm{display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--azul);margin-left:12px;padding-left:2px}
.rm>div{display:flex;gap:10px;align-items:flex-start;margin-left:-15px}
.rm>div>b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--azul);color:var(--blanco);display:grid;place-items:center;font:500 13px "IBM Plex Mono",monospace;box-shadow:0 0 0 3px var(--blanco)}
.rm h3{margin:0;font:700 14px "Sora",sans-serif}
.rm p{font-size:12.5px;line-height:1.35;color:var(--noche)}
.rm span{display:block;font-size:12px;color:var(--ahorro);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--borde);border-radius:999px;padding:4px 10px;font-size:12.5px}
.chip b{font:600 11px "Public Sans",sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#8A5A00;background:var(--tinteS);border-radius:999px;padding:2px 7px}
.hero{font:700 28px/1.12 "Sora",sans-serif!important;letter-spacing:-.015em}
.hero em{font-style:normal;color:var(--ahorro)}
.team{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.team span{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.team b{width:28px;height:28px;border-radius:50%;background:var(--azul);color:var(--blanco);display:grid;place-items:center;font:700 12px "Sora",sans-serif}
.q{font:600 16px/1.4 "Sora",sans-serif;border-left:3px solid var(--azul);padding-left:12px}
/* barra inferior */
.float{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(980px,calc(100% - 32px));pointer-events:none}
.float>*{pointer-events:auto}
.seg{display:inline-flex;background:var(--blanco);border:1px solid var(--borde);border-radius:999px;padding:4px;gap:4px;box-shadow:0 6px 16px rgba(11,38,80,.14)}
.seg button{border:0;background:transparent;color:var(--noche);font:600 14px "Public Sans",sans-serif;border-radius:999px;padding:8px 16px;cursor:pointer;min-height:36px}
.seg button[aria-pressed=true]{background:var(--noche);color:var(--blanco)}
.legend{display:inline-flex;gap:16px;background:rgba(255,255,255,.92);border:1px solid var(--borde);border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:500}
.legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.read{font:500 12.5px "IBM Plex Mono",monospace;background:rgba(255,255,255,.92);border:1px solid var(--borde);border-radius:999px;padding:8px 16px}
.bar{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(1120px,calc(100% - 32px));box-sizing:border-box;background:var(--noche);color:var(--blanco);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 18px 40px rgba(11,38,80,.28);transition:opacity .3s}
body.clean .bar,body.clean .float{opacity:0;pointer-events:none}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#ttl{font:700 19px/1.2 "Sora",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{font-size:13px;line-height:1.35;color:#C9D8E6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px}
.dot{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:var(--blanco);font:600 12.5px "Public Sans",sans-serif;cursor:pointer;padding:0}
.dot.gap{margin-left:7px}
.dot[aria-current=step]{background:var(--sol);border-color:var(--sol);color:var(--noche)}
.btn{min-width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:var(--blanco);font:600 15px "Public Sans",sans-serif;cursor:pointer;padding:0 14px;flex:none}
.btn:hover{background:rgba(255,255,255,.22)}
.btn:disabled{opacity:.35;cursor:default}
.btn.next{background:var(--blanco);color:var(--noche)}
button:focus-visible{outline:2px solid var(--sol);outline-offset:2px}
@media(max-width:1180px){.dots{display:none}}
@media(max-height:900px){.datos{gap:7px;padding:12px 14px}.d h2{font-size:18px}.card{padding:7px 10px}.card p,.it div,.cv div,.rm p,.mk p{font-size:11.5px}.bars{height:100px}.q{font-size:14px}.hero{font-size:23px!important}.card img{max-height:84px;object-fit:contain}.ok,.warn{padding:6px 10px;font-size:12px}.foot{font-size:11px}.guion ul{font-size:13.5px}}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"}}</script>
<script type="module">
// SolPrende · presentación 3D. Edificio en corte, cableado, flujo de energía y panel por partes.
// Editable: PASOS (guion), ETIQUETAS (textos y fichas), CAPAS (panel), y las funciones build*.
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const C = { noche: "#0B2650", azul: "#0166B0", sol: "#F5B404", ahorro: "#3E7D10", fondo: "#F5F8FB", red: "#6DB3E8",
  blanco: "#FFFFFF", hueso: "#EEF2F6", claro: "#E7EEF5", gris: "#C3D1DF", grisOsc: "#6A829A", tinte: "#C9E0F4",
  pasto: "#9CC4AE", follaje: "#3B7A5E", follaje2: "#5A9479", madera: "#C9AE8A", panel: "#13304F" };
const $ = (s) => document.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- motor ----------
const canvas = $("#stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const BG_DAY = new THREE.Color(C.fondo), BG_NIGHT = new THREE.Color("#0B1E33"), BG_PAPER = new THREE.Color("#F5E2BE");
renderer.localClippingEnabled = true;
const clip = new THREE.Plane(new THREE.Vector3(0, -1, 0), 99);   // lo sólido aparece detrás de este plano: así el plano en líneas "se materializa"
scene.background = BG_DAY.clone();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const camera = new THREE.PerspectiveCamera(30, 1, 0.3, 900);
const controls = new OrbitControls(camera, canvas);
Object.assign(controls, { enableDamping: true, dampingFactor: 0.08, maxPolarAngle: Math.PI * 0.495, screenSpacePanning: true, autoRotateSpeed: 0.7, zoomSpeed: 0.8 });
const key = new THREE.DirectionalLight("#FFFFFF", 2.4);
key.position.set(40, 85, 70); key.target.position.set(0, 15, 0); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -55, right: 55, top: 60, bottom: -30, near: 1, far: 260 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.05; key.shadow.radius = 4;
const hemi = new THREE.HemisphereLight("#F7FAFD", "#C9D6E2", 1.1);
scene.add(key, key.target, hemi);

// ---------- utilidades de modelado (todo se instancia por material) ----------
const mats = {};
function mat(color, o = {}) { const k = color + JSON.stringify(o); return mats[k] || (mats[k] = new THREE.MeshStandardMaterial({ color, roughness: 0.82, metalness: 0, ...o })); }
const glow = (color) => mats["g" + color] || (mats["g" + color] = new THREE.MeshBasicMaterial({ color, toneMapped: false }));
const UNIT = new THREE.BoxGeometry(1, 1, 1), UCYL = new THREE.CylinderGeometry(1, 1, 1, 24), USPH = new THREE.SphereGeometry(1, 16, 12);
const pending = new Map(); let mid = 0;
function put(parent, geo, m, sx, sy, sz, x, y, z, rx = 0, shadow = true) {
  if (!m._k) m._k = ++mid;
  const k = parent.uuid + geo.uuid + m._k + shadow;
  if (!pending.has(k)) pending.set(k, { parent, geo, m, shadow, it: [] });
  pending.get(k).it.push([sx, sy, sz, x, y, z, rx]);
}
// caja con base en y; cilindro vertical con base en y
const box = (p, w, h, d, m, x, y, z, shadow = true, rx = 0) => put(p, UNIT, m, w, h, d, x, y + h / 2, z, rx, shadow);
const cyl = (p, r, h, m, x, y, z, shadow = true) => put(p, UCYL, m, r, h, r, x, y + h / 2, z, 0, shadow);
// Además de las mallas, flush() junta las aristas de cada pieza: con ellas se dibuja el plano en líneas.
const EDGES = new Map(), planSrc = new Map();   // escenario (B o PS) -> tramos [clave de orden, ax, ay, az, bx, by, bz]
const edgesOf = (geo) => EDGES.get(geo) || EDGES.set(geo, new THREE.EdgesGeometry(geo, 30).attributes.position.array).get(geo);
EDGES.set(UCYL, [...edgesOf(UCYL), ...[[1, 0], [-1, 0], [0, 1], [0, -1]].flatMap(([x, z]) => [x, -0.5, z, x, 0.5, z])]);   // a los cilindros se les suman 4 generatrices: sin ellas un poste sería solo dos aros
function flush() {
  const o = new THREE.Object3D(), a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), d = new THREE.Vector3(), M = new THREE.Matrix4();
  pending.forEach(({ parent, geo, m, shadow, it }) => {
    const mesh = new THREE.InstancedMesh(geo, m, it.length);
    let root = parent; while (root.parent && root.parent !== scene) root = root.parent;
    const plan = parent !== roofG && planSrc.get(root), e = edgesOf(geo), ax = root === PS ? "x" : "y", piece = root === PS ? 0.19 : 3;
    parent.updateWorldMatrix(true, false);
    it.forEach((q, i) => {
      o.position.set(q[3], q[4], q[5]); o.rotation.set(q[6], 0, 0); o.scale.set(q[0], q[1], q[2]); o.updateMatrix(); mesh.setMatrixAt(i, o.matrix);
      if (!plan) return;
      M.multiplyMatrices(parent.matrixWorld, o.matrix);
      for (let j = 0; j < e.length; j += 6) {     // las aristas largas se cortan en trozos para que crezcan al dibujarse
        a.set(e[j], e[j + 1], e[j + 2]).applyMatrix4(M); b.set(e[j + 3], e[j + 4], e[j + 5]).applyMatrix4(M);
        const n = Math.max(1, Math.ceil(a.distanceTo(b) / piece));
        for (let k = 0; k < n; k++) { c.lerpVectors(a, b, k / n); d.lerpVectors(a, b, (k + 1) / n); plan.push([(c[ax] + d[ax]) / 2, c.x, c.y, c.z, d.x, d.y, d.z]); }
      }
    });
    mesh.castShadow = shadow; mesh.receiveShadow = true; mesh.frustumCulled = false; parent.add(mesh);
  });
  pending.clear();
}
const plans = [], planMat = new THREE.LineBasicMaterial({ color: C.noche, transparent: true });
function buildPlans() {
  planSrc.forEach((src, root) => {
    src.sort((p, q) => p[0] - q[0]);
    const pos = new Float32Array(src.length * 6), keys = new Float32Array(src.length);
    src.forEach((s, i) => { keys[i] = s[0]; pos.set(s.slice(1), i * 6); });
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    const ln = new THREE.LineSegments(g, planMat); ln.frustumCulled = false; ln.userData.plan = true; root.add(ln);
    plans.push({ ln, keys, lo: keys[0], hi: keys[keys.length - 1], n: 0, thr: 0 });
  });
  // todo lo sólido queda sujeto al plano de corte (las líneas del plano no)
  [B, PS].forEach((r) => r.traverse((ob) => { if (ob.userData.plan || !ob.material) return; [].concat(ob.material).forEach((m) => { m.clippingPlanes = [clip]; m.clipShadows = true; }); }));
}
function setPlan(draw, op) {
  plans.forEach((p) => {
    p.thr = p.lo + draw * (p.hi - p.lo) + 1e-3; let lo = 0, hi = p.keys.length;
    while (lo < hi) { const m = (lo + hi) >> 1; p.keys[m] <= p.thr ? (lo = m + 1) : (hi = m); }
    p.n = lo; p.ln.geometry.setDrawRange(0, lo * 2); p.ln.visible = op > 0.01 && lo > 0;
  });
  planMat.opacity = op;
}
function tex(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
const picks = [];   // volúmenes invisibles que reciben el clic
function pick(parent, id, w, h, d, x, y, z) {
  const m = new THREE.Mesh(UNIT, new THREE.MeshBasicMaterial({ visible: false }));
  m.scale.set(w, h, d); m.position.set(x, y + h / 2, z); m.userData.part = id; parent.add(m); picks.push(m); return m;
}

// ---------- edificio ----------
const T = { x0: -9, x1: 9, z0: -5, z1: 5, G: 4.2, fh: 3, floors: 12 };
const R = T.G + T.floors * T.fh;      // altura del techo
const ZP = 0.72, ZA = 0.86;            // planos donde corren los cables (muro del núcleo): continua y alterna
const B = new THREE.Group(); scene.add(B);                 // escenario "edificio"

// ---------- cableado y flujo ----------
class Poly {
  constructor(pts) { this.p = pts.map((a) => new THREE.Vector3(...a)); this.cum = [0]; for (let i = 1; i < this.p.length; i++) this.cum.push(this.cum[i - 1] + this.p[i].distanceTo(this.p[i - 1])); this.len = this.cum[this.cum.length - 1]; }
  at(s, out) { s = Math.max(0, Math.min(this.len, s)); let i = 1; while (i < this.cum.length - 1 && this.cum[i] < s) i++; const t = (s - this.cum[i - 1]) / (this.cum[i] - this.cum[i - 1] || 1); return out.copy(this.p[i - 1]).lerp(this.p[i], t); }
}
// Cada tramo: de dónde sale la energía hacia dónde va, de día. tipo: "cc" paneles→inversor, "red" enlace con la distribuidora, "ca" bienes comunes.
const PATHS = [];

  const ccR = P("ccR", "cc", 0, [[3.3, R + 0.2, 3.9], [3.3, R + 0.2, 1.4], J]);
  const cc = P("cc", "cc", end(ccR), [J, [-2.15, R + 0.2, ZP], [-2.15, 0.9, ZP], [-3.9, 0.9, ZP], [-3.9, 1.35, ZP]]);
  const it = P("it", "cc", end(cc), [[-4.35, 2.0, ZP], [-5.25, 2.0, ZP]]);
  const tm = P("tm", "red", end(it), [[-6.55, 2.0, ZP], [-7.45, 2.0, ZP]]);
  P("mg", "red", end(tm), [[-8.15, 2.0, ZP], [-8.55, 2.0, ZP], [-8.55, 0.5, ZP], [-9.7, 0.5, ZP], [-9.7, 0.25, ZP], [-14.9, 0.25, ZP], [-14.9, 0.25, 3], [-14.9, 7.85, 3], [-27, 7.85, 3]]);
  const trunk = P("trunk", "ca", end(it), [[-5.9, 2.95, ZA], [-5.9, yT, ZA], [-1.7, yT, ZA]]);
  const riser = P("riser", "ca", end(trunk), [[-1.7, yT, ZA], [-1.7, R + 1.3, ZA]]);
  P("pump", "ca", end(trunk), [[-1.7, yT, ZA], [4.4, yT, ZA], [4.4, 1.2, ZA], [4.4, 1.2, 1.6]]);
  P("hall", "ca", trunk.start + 0.6 + 3.52, [[-2.38, yT, ZA], [-2.38, yT, 3.2], [-2.38, 2.9, 3.2]]);
  for (let f = 0; f < T.floors; f++) { const yb = T.G + f * T.fh + 1.78; P("l" + f, "ca", riser.start + (yb - yT), [[-1.7, yb, ZA], [-2.38, yb, ZA], [-2.38, yb, 3.2]]); }

let WIRE_D = 1, segMesh, jointMesh, flowMesh; const segs = [], joints = [], parts = [];
function buildCables() {
  WIRE_D = definePaths();

  PATHS.forEach((p) => p.poly.p.forEach((a, i) => {
    joints.push({ pos: a, at: p.start + p.poly.cum[i] });
    if (i === 0) return; const b = p.poly.p[i - 1], dir = a.clone().sub(b), len = dir.length(); dir.normalize();

  jointMesh = new THREE.InstancedMesh(USPH, cm, joints.length);
  [segMesh, jointMesh].forEach((m) => { m.frustumCulled = false; B.add(m); });
  PATHS.forEach((p) => { const n = Math.max(1, Math.round(p.poly.len / 1.5)); for (let i = 0; i < n; i++) parts.push({ p, u: i / n }); });
  flowMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 12, 10), new THREE.MeshBasicMaterial({ color: "#FFFFFF", toneMapped: false }), parts.length);

function setWire(frac) {

}
// De día todo parte en los paneles y el excedente sale a la red. De noche los paneles no generan y la red entra por el medidor.
const COL_SOL = new THREE.Color(C.sol), COL_RED = new THREE.Color(C.red);
function setFlow(time, on, night) {
  _o.quaternion.identity();
  parts.forEach((q, i) => {
    const t = q.p.tipo, active = on && !(night && t === "cc"), rev = night && t === "red";
    if (!active) { _o.scale.setScalar(0); _o.position.set(0, -50, 0); }
    else { let u = (q.u + (time * 5) / q.p.poly.len) % 1; if (rev) u = 1 - u; q.p.poly.at(u * q.p.poly.len, _v); _o.position.copy(_v); _o.scale.setScalar(0.21); }
    _o.updateMatrix(); flowMesh.setMatrixAt(i, _o.matrix); flowMesh.setColorAt(i, night ? COL_RED : COL_SOL);
